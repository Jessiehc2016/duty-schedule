<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>115 年水陸法會—農禪寺(法華壇-視訊) 值班表</title>
<style>
  :root {
    --primary-color: #2c3e50;
    --border-color: #222;
    --header-bg-main: #dceedc;
    --header-bg-sub: #eef6ee;
    --leave-line-color: #1890ff;
    --substitute-color: #096dd9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    margin: 12px;
    background-color: #f5f7fa;
    color: #222;
    font-size: 18px;
  }
  .container {
    max-width: 1450px;
    margin: 0 auto;
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h2 {
    text-align: center;
    color: var(--primary-color);
    margin: 0 0 16px 0;
    font-size: 26px;
    letter-spacing: 1.5px;
  }
  .toolbar {
    position: sticky;
    top: 8px;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #fafafa;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
  }
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-mode { background-color: #1890ff; color: white; }
  .btn-mode.active { background-color: #fa8c16; }
  .btn-download { background-color: #06c755; color: white; }
  .btn-download:hover { background-color: #05b04b; }
  .btn-reset { background-color: #8c8c8c; color: white; }
  .tips {
    font-size: 15px;
    color: #444;
    line-height: 1.4;
  }
  .legend-line {
    display: inline-block;
    width: 22px;
    height: 3.5px;
    background: var(--leave-line-color);
    vertical-align: middle;
  }

  /* 提示 Toast */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    display: none;
    z-index: 9999;
  }

  /* 請假與代理人樣式 */
  .person-entry {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    border-radius: 4px;
  }
  .leave-checkbox {
    display: none;
    width: 22px;
    height: 22px;
    accent-color: #1890ff;
    cursor: pointer;
  }
  body.edit-mode .leave-checkbox { display: inline-block; }
  body.edit-mode .person-entry {
    background-color: rgba(24, 144, 255, 0.08);
    border: 1.5px dashed #1890ff;
  }
  .person-name {
    padding: 2px 4px;
    outline: none;
    border-radius: 4px;
    cursor: text;
    font-weight: 600;
    font-size: 18px;
  }
  .person-entry.on-leave .person-name {
    text-decoration: line-through;
    text-decoration-color: var(--leave-line-color);
    text-decoration-thickness: 3.5px;
    color: #8c8c8c;
  }
  .substitute-wrapper {
    display: none;
    align-items: center;
    color: var(--substitute-color);
    font-size: 16px;
    font-weight: bold;
  }
  .person-entry.on-leave .substitute-wrapper { display: inline-flex; gap: 3px; }
  .sub-name-input {
    border: none;
    border-bottom: 2px solid var(--substitute-color);
    background: #e6f7ff;
    color: var(--substitute-color);
    font-weight: bold;
    outline: none;
    width: 70px;
    font-size: 16px;
    text-align: center;
    padding: 1px 2px;
    border-radius: 3px;
  }

  /* ====== 電腦版表格 ====== */
  #desktopView { display: block; }
  #mobileView { display: none; }
  .table-responsive { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    text-align: center;
    font-size: 18px;
    background: #fff;
  }
  th, td {
    border: 2px solid var(--border-color);
    padding: 10px 4px;
    vertical-align: middle;
    word-break: break-word;
  }
  th { font-weight: bold; background-color: var(--header-bg-main); font-size: 20px; }
  th.sub-header { background-color: var(--header-bg-sub); font-size: 17px; }
  col.col-date { width: 12%; }
  col.col-duty { width: 11%; }
  .date-cell { font-weight: bold; background-color: #fafafa; font-size: 18px; line-height: 1.4; }
  .duty-cell {
    min-height: 64px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }
  .time-divider { width: 85%; border-top: 1.5px solid #555; margin: 4px 0; }

  /* ====== 手機版卡片 ====== */
  @media (max-width: 850px) {
    #desktopView { display: none; }
    #mobileView { display: block; }
    .container { padding: 12px; }
    h2 { font-size: 22px; }
    .btn { font-size: 16px; padding: 10px 14px; }
    .day-card {
      background: #fff;
      border-radius: 10px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1.5px solid #d9d9d9;
    }
    .day-title {
      font-size: 19px;
      font-weight: bold;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .sec-box {
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .sec-b1 { background: #e6f7ff; border-left: 4px solid #1890ff; }
    .sec-fahua { background: #f9f0ff; border-left: 4px solid #722ed1; }
    .sec-flame { background: #fffbe6; border-left: 4px solid #fa8c16; margin-bottom: 0; }
    .sec-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #333; }
    .sub-slot { background: rgba(255,255,255,0.85); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; }
    .sub-slot:last-child { margin-bottom: 0; }
    .slot-label { font-size: 13px; color: #666; font-weight: bold; margin-bottom: 4px; }
    .mobile-list { display: flex; flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>

<div class="container">
  <h2>115 年水陸法會—農禪寺(法華壇-視訊) 值班表</h2>

  <div class="toolbar">
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <button id="toggleBtn" class="btn btn-mode" onclick="toggleEditMode()">
        📝 登記請假 / 代理人
      </button>
      <!-- 下載儲存功能按鈕 -->
      <button class="btn btn-download" onclick="downloadEditedFile()">
        📥 下載儲存更新檔
      </button>
      <button class="btn btn-reset" onclick="resetDefaultData()">🔄 還原預設</button>
    </div>
    <div class="tips">
      點「<strong>登記請假 / 代理人</strong>」可勾選劃<span class="legend-line"></span>藍線並填<strong style="color:#096dd9;">藍字代理人</strong>；修改完成點「<strong>📥 下載儲存更新檔</strong>」即可保存最新檔案。
    </div>
  </div>

  <!-- 電腦版視圖 -->
  <div id="desktopView" class="table-responsive">
    <table>
      <colgroup>
        <col class="col-date"><col class="col-duty"><col class="col-duty">
        <col class="col-duty"><col class="col-duty"><col class="col-duty">
        <col class="col-duty"><col class="col-duty"><col class="col-duty">
      </colgroup>
      <thead>
        <tr>
          <th rowspan="2">日期</th>
          <th colspan="4">B1 保健室<br><small style="font-weight:normal; font-size: 15px;">(原值班人員 2 人；08:00-17:00)</small></th>
          <th colspan="2">法華壇<br><small style="font-weight:normal; font-size: 15px;">(1 人-大殿；08:00-17:00)</small></th>
          <th colspan="2">五大士焰口<br><small style="font-weight:normal; font-size: 15px;">(2 人-導覽室；17:00-23:00)</small></th>
        </tr>
        <tr>
          <th class="sub-header" colspan="2">上午 (08:00-13:00)</th>
          <th class="sub-header" colspan="2">下午 (13:00-17:00)</th>
          <th class="sub-header">上午 (08:00-13:00)</th>
          <th class="sub-header">下午 (13:00-17:00)</th>
          <th class="sub-header" colspan="2">17:00-23:00</th>
        </tr>
      </thead>
      <tbody id="desktopBody"></tbody>
    </table>
  </div>

  <!-- 手機版視圖 -->
  <div id="mobileView"></div>
</div>

<div id="toast"></div>

<script>
const initialSchedule = [
  {
    date: "11 月 21 日<br>週六",
    dateText: "11 月 21 日 (週六)",
    b1_am1: [{ name: "楊彩菊", leave: false, sub: "" }],
    b1_am2: [{ name: "廖玉梅", leave: false, sub: "" }, { name: "周春玉", leave: false, sub: "" }],
    b1_pm1: [{ name: "吳茂青(2PM)", leave: false, sub: "" }],

    fahua_am: [{ name: "劉淑美", leave: false, sub: "" }],

    dateText: "11 月 22 日 (週日)",
    b1_am1: [{ name: "彭金嬰", leave: false, sub: "" }],
    b1_am2: [{ name: "蔡碧枝", leave: false, sub: "" }],
    b1_pm1: [{ name: "彭金嬰", leave: false, sub: "" }],
    b1_pm2: [{ name: "蔡碧枝", leave: false, sub: "" }],
    fahua_am: [{ name: "林玉如", leave: false, sub: "" }],

    flame_1: [{ name: "X", leave: false, sub: "" }]
  },
  {
    date: "11 月 23 日<br>週一",
    dateText: "11 月 23 日 (週一)",
    b1_am1: [{ name: "嚴雅君", leave: false, sub: "" }],
    b1_am2: [{ name: "呂淑美", leave: false, sub: "" }],
    b1_pm1: [{ name: "李志銘", leave: false, sub: "" }],
    b1_pm2: [{ name: "李峙雨", leave: false, sub: "" }],
    fahua_am: [{ name: "鄭雅慧", leave: false, sub: "" }],
    fahua_pm: [{ name: "呂淑美", leave: false, sub: "" }],
    flame_0: [{ name: "X", leave: false, sub: "" }],
    flame_1: [{ name: "X", leave: false, sub: "" }]
  },
  {
    date: "11 月 24 日<br>週二",
    dateText: "11 月 24 日 (週二)",
    b1_am1: [{ name: "翁順吉", leave: false, sub: "" }],
    b1_am2: [{ name: "王賢貞", leave: false, sub: "" }],
    b1_pm1: [
      { name: "錢翠琴", leave: false, sub: "" },
      { name: "王賢貞", leave: false, sub: "" },
      { isDivider: true },
      { name: "施莉莎醫師 (16:00)", leave: false, sub: "" }
    ],
    b1_pm2: [{ name: "陳靜寧", leave: false, sub: "" }, { name: "高碧月", leave: false, sub: "" }],
    fahua_am: [{ name: "林維君", leave: false, sub: "" }],
    fahua_pm: [{ name: "許淑娟", leave: false, sub: "" }],
    flame_0: [{ name: "X", leave: false, sub: "" }],
    flame_1: [{ name: "X", leave: false, sub: "" }]
  },
  {
    date: "11 月 25 日<br>週三",
    dateText: "11 月 25 日 (週三)",
    b1_am1: [{ name: "胡念華醫師", leave: false, sub: "" }],
    b1_am2: [{ name: "江鈴玉", leave: false, sub: "" }, { name: "王良玉", leave: false, sub: "" }],
    b1_pm1: [{ name: "陳蓉華", leave: false, sub: "" }],
    b1_pm2: [{ name: "王美靈", leave: false, sub: "" }],
    fahua_am: [{ name: "鄭雅慧", leave: false, sub: "" }],
    fahua_pm: [{ name: "鄭雅慧", leave: false, sub: "" }],
    flame_0: [{ name: "X", leave: false, sub: "" }],
    flame_1: [{ name: "X", leave: false, sub: "" }]
  },
  {
    date: "11 月 26 日<br>週四",
    dateText: "11 月 26 日 (週四)",
    b1_am1: [{ name: "黃英訓", leave: false, sub: "" }],
    b1_am2: [{ name: "王靜美", leave: false, sub: "" }],
    b1_pm1: [{ name: "陳珍珠", leave: false, sub: "" }],
    b1_pm2: [{ name: "齊月蓮", leave: false, sub: "" }],
    fahua_am: [{ name: "張鈞", leave: false, sub: "" }],
    fahua_pm: [{ name: "X", leave: false, sub: "" }],
    flame_0: [{ name: "X", leave: false, sub: "" }],
    flame_1: [{ name: "X", leave: false, sub: "" }]
  },
  {
    date: "11 月 27 日<br>週五",
    dateText: "11 月 27 日 (週五)",
    b1_am1: [{ name: "陳慧莊", leave: false, sub: "" }],
    b1_am2: [{ name: "溫素鳳", leave: false, sub: "" }],
    b1_pm1: [{ name: "鍾泉", leave: false, sub: "" }],
    b1_pm2: [{ name: "陳于玲", leave: false, sub: "" }],
    fahua_am: [{ name: "陳秀貞", leave: false, sub: "" }],
    fahua_pm: [{ name: "林玉如", leave: false, sub: "" }],
    flame_0: [{ name: "X", leave: false, sub: "" }],
    flame_1: [{ name: "X", leave: false, sub: "" }]
  }
];

let scheduleData = [];
let isEditMode = false;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2500);
}

function init() {
  const saved = localStorage.getItem("waterland_schedule_responsive_v2");
  if (saved) {
    try { scheduleData = JSON.parse(saved); } catch(e) { scheduleData = JSON.parse(JSON.stringify(initialSchedule)); }
  } else {
    scheduleData = JSON.parse(JSON.stringify(initialSchedule));
  }
  renderAll();
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  const btn = document.getElementById("toggleBtn");
  if (isEditMode) {
    document.body.classList.add("edit-mode");
    btn.classList.add("active");
    btn.innerHTML = "✅ 完成登記 (關閉並返回)";
  } else {
    document.body.classList.remove("edit-mode");
    btn.classList.remove("active");
    btn.innerHTML = "📝 登記請假 / 代理人";
    saveData();
    showToast("已完成登記！畫面已返回乾淨班表");
  }
}

function renderAll() {
  renderDesktop();
  renderMobile();
}

function renderDesktop() {
  const tbody = document.getElementById("desktopBody");
  tbody.innerHTML = "";
  scheduleData.forEach((row, rowIndex) => {
    const tr = document.createElement("tr");
    const tdDate = document.createElement("td");
    tdDate.className = "date-cell";
    tdDate.innerHTML = row.date;
    tr.appendChild(tdDate);

    ['b1_am1', 'b1_am2', 'b1_pm1', 'b1_pm2', 'fahua_am', 'fahua_pm', 'flame_0', 'flame_1'].forEach(slot => {
      tr.appendChild(createCell(rowIndex, slot));
    });
    tbody.appendChild(tr);
  });
}

function createCell(rowIndex, slotKey) {
  const td = document.createElement("td");
  const container = document.createElement("div");
  container.className = "duty-cell";
  const list = scheduleData[rowIndex][slotKey] || [];

  list.forEach((item, itemIndex) => {
    if (item.isDivider) {
      const d = document.createElement("div");
      d.className = "time-divider";
      container.appendChild(d);
      return;
    }
    container.appendChild(createPersonNode(rowIndex, slotKey, itemIndex, item));
  });
  td.appendChild(container);
  return td;
}

function renderMobile() {
  const mobileContainer = document.getElementById("mobileView");
  mobileContainer.innerHTML = "";

  scheduleData.forEach((row, rowIndex) => {
    const card = document.createElement("div");
    card.className = "day-card";
    card.innerHTML = `<div class="day-title">📅 ${row.dateText}</div>`;

    // 1. B1 保健室
    const b1 = document.createElement("div");
    b1.className = "sec-box sec-b1";
    b1.innerHTML = `<div class="sec-title">🏥 B1 保健室 (08:00-17:00)</div>`;
    b1.appendChild(createMobileSlot("上午 (08:00-13:00)", rowIndex, ['b1_am1', 'b1_am2']));
    b1.appendChild(createMobileSlot("下午 (13:00-17:00)", rowIndex, ['b1_pm1', 'b1_pm2']));
    card.appendChild(b1);

    // 2. 法華壇
    const fahua = document.createElement("div");
    fahua.className = "sec-box sec-fahua";
    fahua.innerHTML = `<div class="sec-title">🪷 法華壇 (大殿 08:00-17:00)</div>`;
    fahua.appendChild(createMobileSlot("上午 (08:00-13:00)", rowIndex, ['fahua_am']));
    fahua.appendChild(createMobileSlot("下午 (13:00-17:00)", rowIndex, ['fahua_pm']));
    card.appendChild(fahua);

    // 3. 五大士焰口
    const flame = document.createElement("div");
    flame.className = "sec-box sec-flame";
    flame.innerHTML = `<div class="sec-title">🕯️ 五大士焰口 (17:00-23:00)</div>`;
    flame.appendChild(createMobileSlot("值班人員 (2人)", rowIndex, ['flame_0', 'flame_1']));
    card.appendChild(flame);

    mobileContainer.appendChild(card);
  });
}

function createMobileSlot(title, rowIndex, slotKeys) {
  const div = document.createElement("div");
  div.className = "sub-slot";
  div.innerHTML = `<div class="slot-label">${title}</div>`;
  const listDiv = document.createElement("div");
  listDiv.className = "mobile-list";

  slotKeys.forEach(key => {
    (scheduleData[rowIndex][key] || []).forEach((item, itemIndex) => {
      if (item.isDivider) {
        const d = document.createElement("div");
        d.className = "time-divider";
        listDiv.appendChild(d);
        return;
      }
      listDiv.appendChild(createPersonNode(rowIndex, key, itemIndex, item));
    });
  });
  div.appendChild(listDiv);
  return div;
}

function createPersonNode(rowIndex, slotKey, itemIndex, item) {
  const isX = item.name.trim().toUpperCase() === "X";
  const entry = document.createElement("div");
  entry.className = `person-entry ${item.leave ? 'on-leave' : ''}`;

  if (!isX) {
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "leave-checkbox";
    cb.checked = item.leave;
    cb.onchange = (e) => {
      item.leave = e.target.checked;
      renderAll();
      saveData();
    };
    entry.appendChild(cb);
  }

  const nameSpan = document.createElement("span");
  nameSpan.className = "person-name";
  nameSpan.contentEditable = "true";
  nameSpan.innerText = item.name;
  nameSpan.onblur = () => {
    item.name = nameSpan.innerText.trim();
    saveData();
  };
  entry.appendChild(nameSpan);

  if (!isX) {
    const subWrap = document.createElement("span");
    subWrap.className = "substitute-wrapper";
    subWrap.innerHTML = `代: <input type="text" class="sub-name-input" value="${item.sub || ''}" placeholder="代理人" oninput="updateSub(${rowIndex}, '${slotKey}', ${itemIndex}, this.value)">`;
    entry.appendChild(subWrap);
  }
  return entry;
}

function updateSub(rowIndex, slotKey, itemIndex, val) {
  scheduleData[rowIndex][slotKey][itemIndex].sub = val;
  saveData();
}

function saveData() {
  localStorage.setItem("waterland_schedule_responsive_v2", JSON.stringify(scheduleData));
}

// 下載儲存更新檔功能
function downloadEditedFile() {
  if (isEditMode) toggleEditMode();

  const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob(["\uFEFF" + htmlContent], { type: 'text/html;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '115水陸法會值班表_最新回報.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast("已成功下載儲存最新檔案！");
}

function resetDefaultData() {
  if (confirm("確定要重設為初始排班名單嗎？")) {
    scheduleData = JSON.parse(JSON.stringify(initialSchedule));
    localStorage.removeItem("waterland_schedule_responsive_v2");
    renderAll();
    showToast("已還原預設名單");
  }
}

window.onload = init;
</script>
</body>
</html>
